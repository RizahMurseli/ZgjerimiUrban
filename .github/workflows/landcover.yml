name: Build land cover
# Computes dist/data/<ISO3>/landcover.json (Esri 10m annual land cover, 2017 onwards, under
# the WSF Tracker construction of every step) for country packs that already exist, then
# commits and republishes. This activates the land-cover part of the
# "Qëndrueshmëria" tab (SDG 15.1.1, 2.4.1/15.3.1, 11.7.1, "Mbi çfarë u ndërtua?").
on:
  workflow_dispatch:
    inputs:
      countries:
        description: 'Kodet ISO3, të ndara me presje (bosh = të gjitha paketat)'
        default: 'XKX'
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  landcover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: .cache
          key: landcover-${{ github.run_id }}
          restore-keys: |
            landcover-
            update-
      - name: Units and land cover
        env:
          COUNTRIES: ${{ inputs.countries }}
        run: |
          list="$COUNTRIES"
          if [ -z "$list" ]; then list=$(python3 -c "import json;print(','.join(p['id'] for p in json.load(open('dist/data/countries.json'))))"); fi
          for iso in ${list//,/ }; do
            echo "::group::$iso"
            # Full-precision unit outlines (.cache) are rebuilt from the sources, then the unit statistics.
            python scripts/prepare_boundaries.py --country "$iso"
            python scripts/compute_stats.py --country "$iso"
            python scripts/prepare_landcover.py --country "$iso"
            echo "::endgroup::"
          done
      - name: Commit and republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then echo "Asgjë e re."; exit 0; fi
          git commit -m "Mbulesa e tokës (Esri 10m Land Cover): ${{ inputs.countries }}"
          git push
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
