name: Diag legend
on:
  push:
    branches: [diag-legend]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install pillow >/dev/null
          curl -s -o legend.png 'https://geoservice.dlr.de/eoc/land/wms?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetLegendGraphic&LAYER=WSF_TRACKER&FORMAT=image/png'
          file legend.png; ls -la legend.png
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('legend.png').convert('RGBA'); print('size', im.size)
          prev=None
          for y in range(im.height):
              c = im.getpixel((10,y))
              if c != prev: print(y, c); prev = c
          PY
          curl -s 'https://geoservice.dlr.de/eoc/land/wms?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetCapabilities' | grep -A40 '<Name>WSF_TRACKER</Name>' | head -60
      - uses: actions/upload-artifact@v4
        with:
          name: legend
          path: legend.png
